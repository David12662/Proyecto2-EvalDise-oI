<!doctype html>
<html lang="en">

<head>
    <title>Pirueta</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/index.css">

</head>

<body data-bs-theme="dark">
    <header>
        <nav class="navbar navbar-light py-4">
            <div class="container d-flex justify-content-between">

                <div>
                    <img class="image-logo" src="./styles/images/logo.png" alt="Pirueta">
                </div>


                <div class="d-flex gap-5 menu">
                    <h1 class="nav-item">Menu</h1>
                    <h1 class="nav-item">Contacto</h1>
                    <h1 class="nav-item">Cartas</h1>
                </div>

                <div>
                    <button class="menubutton" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#menuOffcanvas" aria-controls="cartOffcanvas">
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container text-center mt-5">
        <h1 class="mb-4 letters">Nuestros Restaurantes</h1>
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="restaurant-card">
                    <img class="restaurant-img" src="styles/images/Italia.png" alt="Roma">
                    <div class="restaurant-name">Roma</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="restaurant-card">
                    <img class="restaurant-img" src="styles/images/SãoPaulo.png" alt="São Paulo">
                    <div class="restaurant-name">São Paulo</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="restaurant-card">
                    <img class="restaurant-img" src="styles/images/Elcairo.png" alt="El Cairo">
                    <div class="restaurant-name">El Cairo</div>
                </div>
            </div>
        </div>

        <!--Offcanvas-->
        <div class="offcanvas offcanvas-start custom-offcanvas" tabindex="-1" id="menuOffcanvas" aria-labelledby="menuOffcanvasLabel">
            <div class="offcanvas-body d-flex justify-content-between">
                <div class="logo-section">
                    <h2 class="logo">Voltereta</h2>
                </div>
            
                <div class="divider"></div> 
            
                <div class="destinations">
                    <h2 class="city">Roma</h2>
                    <h2 class="city">São Paulo</h2>
                    <h2 class="city">El cairo</h2>
                </div>
            </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous">
        </script>
    <script src="js/canvasanimation.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous">
        </script>
</body>

</html>
